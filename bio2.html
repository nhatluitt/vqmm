<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Slay Bio</title>
    <!-- Nhúng Tailwind CSS và FontAwesome để lấy icon mạng xã hội -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* Hiệu ứng nền động ma mị (Mystic Animated Background) */
        .mystic-bg {
            background: linear-gradient(-45deg, #09090b, #180828, #051622, #000000);
            background-size: 400% 400%;
            animation: mysticMove 15s ease infinite;
        }

        @keyframes mysticMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Card phát sáng huyền ảo */
        .glow-card {
            box-shadow: 0 0 30px rgba(147, 51, 234, 0.2), inset 0 0 15px rgba(236, 72, 153, 0.05);
            border: 1px solid rgba(168, 85, 247, 0.4);
        }

        /* Hiệu ứng đom đóm/hạt bụi ma mị bay lơ lửng phía sau */
        .particles {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }
        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(168, 85, 247, 0.3);
            animation: floatUp 8s infinite ease-in-out;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { opacity: 0.6; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }
    </style>
</head>
<body class="mystic-bg text-zinc-100 flex items-center justify-center min-h-screen p-4 relative overflow-hidden">

    <!-- Các hạt động ma mị chạy ngầm phía sau -->
    <div class="particles">
        <div class="particle" style="width: 4px; height: 4px; left: 10%; animation-delay: 0s; animation-duration: 12s;"></div>
        <div class="particle" style="width: 6px; height: 6px; left: 30%; animation-delay: 2s; animation-duration: 15s; background: rgba(236, 72, 153, 0.2);"></div>
        <div class="particle" style="width: 3px; height: 3px; left: 55%; animation-delay: 4s; animation-duration: 10s;"></div>
        <div class="particle" style="width: 5px; height: 5px; left: 75%; animation-delay: 1s; animation-duration: 18s;"></div>
        <div class="particle" style="width: 7px; height: 7px; left: 85%; animation-delay: 5s; animation-duration: 14s; background: rgba(147, 51, 234, 0.2);"></div>
    </div>

    <!-- Card Bio Chính -->
    <div class="glow-card bg-zinc-900/80 backdrop-blur-xl rounded-2xl p-6 max-w-sm w-full text-center transition-all duration-300 hover:scale-[1.02] z-10 relative">
        
        <!-- Avatar -->
        <div class="relative w-24 h-24 mx-auto mb-4">
            <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=500" 
                 alt="Avatar" 
                 class="w-full h-full object-cover rounded-full border-2 border-purple-500 shadow-lg">
            <div class="absolute bottom-0 right-0 w-4 h-4 bg-green-500 border-2 border-zinc-900 rounded-full animate-pulse"></div>
        </div>

        <!-- Tên / Username -->
        <h1 class="text-xl font-extrabold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-500 uppercase">
            @ngnhat
        </h1>
        <p class="text-xs text-zinc-500 mt-1 mb-6 font-mono">⚡ nguyen long nhat</p>

     

        <!-- Danh sách Nút MXH (Social Buttons) -->
        <div class="space-y-3">
            <!-- Discord -->
            <a href="YOUR_DISCORD_LINK" target="_blank" 
               class="flex items-center justify-between w-full bg-zinc-800/40 hover:bg-[#5865F2] text-zinc-300 hover:text-white font-medium py-3 px-4 rounded-xl border border-zinc-700/30 hover:border-[#5865F2] transition-all duration-200 group">
                <div class="flex items-center gap-3">
                    <i class="fa-brands fa-discord text-lg text-[#5865F2] group-hover:text-white transition-colors"></i>
                    <span class="text-sm tracking-wide">Discord</span>
                </div>
                <i class="fa-solid fa-chevron-right text-xs opacity-40 group-hover:opacity-100 transition-opacity"></i>
            </a>

            <!-- Facebook -->
            <a href="YOUR_FACEBOOK_LINK" target="_blank" 
               class="flex items-center justify-between w-full bg-zinc-800/40 hover:bg-[#1877F2] text-zinc-300 hover:text-white font-medium py-3 px-4 rounded-xl border border-zinc-700/30 hover:border-[#1877F2] transition-all duration-200 group">
                <div class="flex items-center gap-3">
                    <i class="fa-brands fa-facebook text-lg text-[#1877F2] group-hover:text-white transition-colors"></i>
                    <span class="text-sm tracking-wide">Facebook</span>
                </div>
                <i class="fa-solid fa-chevron-right text-xs opacity-40 group-hover:opacity-100 transition-opacity"></i>
            </a>

            <!-- Spotify -->
            <a href="YOUR_SPOTIFY_LINK" target="_blank" 
               class="flex items-center justify-between w-full bg-zinc-800/40 hover:bg-[#1DB954] text-zinc-300 hover:text-white font-medium py-3 px-4 rounded-xl border border-zinc-700/30 hover:border-[#1DB954] transition-all duration-200 group">
                <div class="flex items-center gap-3">
                    <i class="fa-brands fa-spotify text-lg text-[#1DB954] group-hover:text-white transition-colors"></i>
                    <span class="text-sm tracking-wide">Spotify</span>
                </div>
                <i class="fa-solid fa-chevron-right text-xs opacity-40 group-hover:opacity-100 transition-opacity"></i>
            </a>

            <!-- Github -->
            <a href="YOUR_GITHUB_LINK" target="_blank" 
               class="flex items-center justify-between w-full bg-zinc-800/40 hover:bg-zinc-100 hover:text-zinc-950 font-medium py-3 px-4 rounded-xl border border-zinc-700/30 hover:border-zinc-100 transition-all duration-200 group">
                <div class="flex items-center gap-3">
                    <i class="fa-brands fa-github text-lg text-zinc-400 group-hover:text-zinc-950 transition-colors"></i>
                    <span class="text-sm tracking-wide">GitHub</span>
                </div>
                <i class="fa-solid fa-chevron-right text-xs opacity-40 group-hover:opacity-100 transition-opacity"></i>
            </a>
        </div>

        <!-- Footer nhỏ -->
        <p class="text-[10px] text-zinc-600 mt-6 font-mono">© Designed with attitude.</p>
    </div>

</body>
</html>
