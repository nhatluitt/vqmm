<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vòng Quay May Mắn</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1c29, #282b42);
            color: #fff;
        }

        h1 {
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }

        .wheel-container {
            position: relative;
            width: 400px;
            height: 400px;
            margin-bottom: 30px;
        }

        /* Kim chỉ phần thưởng */
        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 40px solid #ff4757;
            z-index: 10;
            filter: drop-shadow(0 4px 5px rgba(0,0,0,0.5));
        }

        .center-logo {
            position: absolute;
            width: 90px;  
            height: 90px; 
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: #fff;
            border: 4px solid #f1c40f;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
            z-index: 5;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .center-logo img {
            width: 300%;
            height: 308%;
            object-fit: contain;
            border-radius: 82%;
        }

        /* Vòng quay */
        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            border: 8px solid #f1c40f;
            box-shadow: 0 0 20px rgba(241, 196, 15, 0.5), inset 0 0 20px rgba(0,0,0,0.5);
            transition: transform 4s cubic-bezier(0.1, 0.8, 0.1, 1);
        }

        /* Nút quay */
        .spin-btn {
            padding: 12px 35px;
            font-size: 18px;
            font-weight: bold;
            color: #1a1c29;
            background: #f1c40f;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(241, 196, 15, 0.4);
            transition: all 0.2s ease;
        }

        .spin-btn:hover {
            background: #f39c12;
            transform: translateY(-2px);
        }

        .spin-btn:disabled {
            background: #95a5a6;
            color: #7f8c8d;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        /* Popup thông báo kết quả */
        .result-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #fff;
            color: #333;
            padding: 25px 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            z-index: 100;
            animation: fadeIn 0.3s ease;
        }

        .result-modal h2 {
            color: #2ed573;
            margin-bottom: 10px;
        }

        .result-modal button {
            margin-top: 15px;
            padding: 8px 20px;
            border: none;
            background: #ff4757;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 99;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, -60%); }
            to { opacity: 1; transform: translate(-50%, -50%); }
        }
    </style>
</head>
<body>

    <h1>Vòng Quay May Mắn</h1>

    <div class="wheel-container">
        <div class="pointer"></div>
        
        <div class="center-logo">
            <img src="Artboard 1.png" alt="Logo">
        </div>

        <canvas id="wheelCanvas" class="wheel" width="400" height="400"></canvas>
    </div>

    <button class="spin-btn" id="spinBtn">QUAY NGAY</button>

    <div class="overlay" id="overlay"></div>
    <div class="result-modal" id="resultModal">
        <h2>Chúc Mừng!</h2>
        <p id="resultText">Bạn đã trúng...</p>
        <button onclick="closeModal()">Đóng</button>
    </div>

    <script>
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const spinBtn = document.getElementById('spinBtn');
        const resultModal = document.getElementById('resultModal');
        const resultText = document.getElementById('resultText');
        const overlay = document.getElementById('overlay');

        // ĐÃ ĐỔI THỨ TỰ: "Giải 30k" nằm ở vị trí số 0 và "Chúc bạn may mắn" nằm ở vị trí số 4 để ĐỐI DIỆN NHAU chuẩn xác
        const prizes = [
            { text: "Giải 30k", weight: 10.0, color: "#e74c3c" },          // Ô số 1 (Nằm trên)
            { text: "Giải 10k", weight: 15.0, color: "#16a085" },
            { text: "Giải 20k", weight: 12.5, color: "#2980b9" },
            { text: "Nước / Bim Bim", weight: 10.0, color: "#8e44ad" },
            
            { text: "Chúc bạn may mắn", weight: 15.0, color: "#2c3e50" },   // Ô số 5 (Đối diện thẳng hàng với 30k)
            { text: "Giải 10k", weight: 15.0, color: "#1abc9c" },
            { text: "Giải 20k", weight: 12.5, color: "#3498db" },
            { text: "Nước / Bim Bim", weight: 10.0, color: "#9b59b6" }
        ];

        const numSegments = prizes.length;
        const segmentAngle = 360 / numSegments; 
        let currentRotation = 0;
        let isSpinning = false;

        // Vẽ vòng quay lên Canvas
        function drawWheel() {
            const size = canvas.width;
            const center = size / 2;

            ctx.clearRect(0, 0, size, size); 

            for (let i = 0; i < numSegments; i++) {
                const startAngle = (i * segmentAngle * Math.PI) / 180;
                const endAngle = ((i + 1) * segmentAngle * Math.PI) / 180;

                ctx.beginPath();
                ctx.moveTo(center, center);
                ctx.arc(center, center, center, startAngle, endAngle);
                ctx.fillStyle = prizes[i].color;
                ctx.fill();
                ctx.stroke();

                ctx.save();
                ctx.translate(center, center);
                ctx.rotate(startAngle + (segmentAngle * Math.PI) / 360);
                ctx.textAlign = "right";
                ctx.fillStyle = "#fff";
                ctx.font = "bold 13px Arial"; 
                ctx.fillText(prizes[i].text, center - 25, 5);
                ctx.restore();
            }
        }

        // Chọn phần thưởng dựa trên tỷ lệ phần trăm chuẩn
        function getWeightedPrizeIndex() {
            const random = Math.random() * 100;
            let cumulativeWeight = 0;

            for (let i = 0; i < prizes.length; i++) {
                cumulativeWeight += prizes[i].weight;
                if (random <= cumulativeWeight) {
                    return i;
                }
            }
            return 0;
        }

        // Xử lý sự kiện quay
        spinBtn.addEventListener('click', () => {
            if (isSpinning) return;
            isSpinning = true;
            spinBtn.disabled = true;

            const prizeIndex = getWeightedPrizeIndex();
            const prizeCenterAngle = (prizeIndex * segmentAngle) + (segmentAngle / 2);
            const extraTargetAngle = 270 - prizeCenterAngle;
            const totalRotationNeeded = (360 * 5) + extraTargetAngle;

            currentRotation += totalRotationNeeded - (currentRotation % 360);
            canvas.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                isSpinning = false;
                spinBtn.disabled = false;
                
                const modalTitle = resultModal.querySelector('h2');
                if (prizes[prizeIndex].text === "Chúc bạn may mắn") {
                    modalTitle.innerText = "Tiếc quá!";
                    modalTitle.style.color = "#e74c3c";
                    resultText.innerHTML = `<strong>Chúc bạn may mắn lần sau nhé!</strong>`;
                } else {
                    modalTitle.innerText = "Chúc Mừng!";
                    modalTitle.style.color = "#2ed573";
                    resultText.innerHTML = `Bạn đã trúng phần quà: <strong>${prizes[prizeIndex].text}</strong>`;
                }
                
                resultModal.style.display = 'block';
                overlay.style.display = 'block';
            }, 4000);
        });

        function closeModal() {
            resultModal.style.display = 'none';
            overlay.style.display = 'none';
        }

        drawWheel();
    </script>
    <a href="THAY_LINK_CỦA_BẠN_VÀO_ĐÂY" target="_blank" 
   class="relative inline-flex items-center justify-center p-0.5 mb-2 me-2 overflow-hidden text-sm font-bold text-zinc-100 rounded-xl group bg-gradient-to-br from-purple-600 to-pink-500 group-hover:from-purple-600 group-hover:to-pink-500 hover:text-white focus:ring-4 focus:outline-none focus:ring-purple-800 transition-all duration-300 hover:shadow-[0_0_20px_rgba(168,85,247,0.6)]">
    
    <!-- Lớp nền phía trong tạo hiệu ứng viền phát sáng -->
    <span class="relative px-6 py-3 transition-all duration-200 bg-zinc-900 rounded-[10px] group-hover:bg-opacity-0 w-full text-center flex items-center gap-2 justify-center">
        <!-- Bạn có thể thay đổi icon và chữ ở đây -->
        <i class="fa-solid fa-bolt text-pink-500 group-hover:text-white transition-colors"></i>
        <span>Click Me Slay</span>
    </span>
</a>
</body>
</html>
